// ───────────────────────── helpers (shared logic, not layout) ─────────────────────────
const SEG = /^[a-z0-9]+(-[a-z0-9]+)*$/;
function parsePath(path) {
  const kind = path.endsWith('/') ? 'bundle' : 'file';
  const trimmed = kind === 'bundle' ? path.slice(0, -1) : path.replace(/\.html$/, '');
  const segs = trimmed.split('/');
  return { kind, project: segs[0], categories: segs.slice(1, -1), name: segs[segs.length - 1], stem: trimmed };
}
const urlOf = (path) => PUB + path;
function validatePath(path) {
  if (!path) return { code: 'request_invalid', message: 'Enter a target path.' };
  const isBundle = path.endsWith('/'), isFile = path.endsWith('.html');
  if (!isBundle && !isFile) return { code: 'path_invalid', message: 'End with .html (single file) or / (Bundle).' };
  const { stem } = parsePath(path);
  if (stem.length > 200) return { code: 'name_invalid', message: 'Artifact path is longer than 200 characters.' };
  const segs = stem.split('/');
  if (segs.length < 2) return { code: 'name_invalid', message: 'Needs a Project and a name: <project>/<category…>/<name>.' };
  for (const s of segs) {
    if (s === 'index') return { code: 'name_reserved', message: '"index" is reserved at every level.' };
    if (!SEG.test(s) || s.length > 63) return { code: 'name_invalid', message: `"${s}" — use a–z, 0–9 and inner hyphens, 1–63 chars, no dots.` };
  }
  return null;
}
function checkConflicts(artifacts, path) {
  const { stem, kind } = parsePath(path);
  const other = kind === 'bundle' ? stem + '.html' : stem + '/';
  if (artifacts.some((a) => a.path === other)) return { code: 'shape_conflict', message: `${other} already exists; delete it first to change shape.` };
  for (const a of artifacts) {
    if (a.path.endsWith('/') && path.startsWith(a.path) && path !== a.path) return { code: 'nesting_conflict', message: `Would sit inside the Bundle ${a.path}.` };
    if (kind === 'bundle' && a.path.startsWith(path) && a.path !== path) return { code: 'nesting_conflict', message: `${path} is a Category holding ${a.path}.` };
  }
  return null;
}
const slug = (s) => s.toLowerCase().replace(/\.html?$/, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 63) || 'untitled';
function fmtSize(n) {
  if (!n) return '—';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}
function ago(iso) {
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 90) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' h ago';
  if (s < 86400 * 30) return Math.round(s / 86400) + ' d ago';
  return new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}
const fullDate = (iso) => new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
function copy(text, setToast) { navigator.clipboard?.writeText(text).catch(() => {}); setToast?.('Copied ' + text); }
function allProjects(state) {
  const set = new Set(Object.keys(state.projects));
  state.artifacts.forEach((a) => set.add(parsePath(a.path).project));
  return [...set].sort();
}

// Read picked/dropped files: [{rel, file}] with the top folder stripped for folders.
async function filesFromDataTransfer(dt) {
  const out = [];
  const items = [...(dt.items || [])].map((i) => i.webkitGetAsEntry?.()).filter(Boolean);
  if (!items.length) return filesFromList(dt.files);
  async function walk(entry, prefix) {
    if (entry.isFile) {
      const file = await new Promise((res, rej) => entry.file(res, rej));
      out.push({ rel: prefix + entry.name, file });
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      let batch;
      do {
        batch = await new Promise((res, rej) => reader.readEntries(res, rej));
        for (const e of batch) await walk(e, prefix + entry.name + '/');
      } while (batch.length);
    }
  }
  for (const e of items) await walk(e, '');
  return out;
}
function filesFromList(list) {
  return [...list].map((f) => ({ rel: f.webkitRelativePath || f.name, file: f }));
}
async function describeUpload(entries) {
  if (!entries.length) return null;
  const tops = new Set(entries.map((e) => e.rel.split('/')[0]));
  const isFolder = entries.some((e) => e.rel.includes('/')) && tops.size === 1;
  let kind, files, suggested;
  if (isFolder) {
    const top = [...tops][0];
    kind = 'bundle';
    suggested = slug(top);
    files = entries.map((e) => ({ rel: e.rel.slice(top.length + 1), file: e.file }));
  } else if (entries.length === 1 && /\.html?$/i.test(entries[0].rel)) {
    kind = 'file';
    suggested = slug(entries[0].rel);
    files = entries;
  } else {
    return { error: { code: 'request_invalid', message: 'Drop one .html file or one folder.' } };
  }
  const dot = files.filter((f) => f.rel.split('/').some((s) => s.startsWith('.')));
  files = files.filter((f) => !dot.includes(f));
  const size = files.reduce((n, f) => n + f.file.size, 0);
  const entry = kind === 'bundle' ? files.find((f) => f.rel === 'index.html') : files[0];
  let title = '';
  if (entry) {
    const text = await entry.file.slice(0, 64 * 1024).text();
    title = (text.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1] || '').trim();
  }
  let error = null;
  if (kind === 'bundle' && !entry) error = { code: 'index_missing', message: 'The folder has no index.html at its root.' };
  if (size > 100 * 1024 * 1024) error = { code: 'too_large', message: 'Over the 100 MB limit.' };
  if (files.length > 2000) error = { code: 'too_many_files', message: 'Over the 2,000-file limit.' };
  return { kind, suggested, count: files.length, size, skipped: dot.map((f) => f.rel), title, error };
}

// ───────────────────────── store (in-memory, stubbed API) ─────────────────────────
function reducer(state, a) {
  switch (a.type) {
    case 'delete': return { ...state, artifacts: state.artifacts.filter((x) => x.path !== a.path) };
    case 'desc': return { ...state, artifacts: state.artifacts.map((x) => (x.path === a.path ? { ...x, description: a.text } : x)) };
    case 'projectDesc': {
      const projects = { ...state.projects };
      if (a.text) projects[a.project] = a.text; else delete projects[a.project];
      return { ...state, projects };
    }
    case 'upsert': {
      const i = state.artifacts.findIndex((x) => x.path === a.art.path);
      const artifacts = [...state.artifacts];
      if (i >= 0) artifacts[i] = { ...artifacts[i], ...a.art, created: artifacts[i].created, description: a.art.description ?? artifacts[i].description };
      else artifacts.push({ description: '', ...a.art, created: a.art.updated });
      return { ...state, artifacts };
    }
    case 'outcome': return { ...state, nextOutcome: a.value };
    default: return state;
  }
}
// Simulated PUT /ui/api/artifacts/<path>: validate → progress → result. Returns {status, body} or {error}.
function simulatePublish(state, dispatch, { path, upload, description }, onProgress) {
  return new Promise((resolve) => {
    const bad = validatePath(path) || upload?.error || (state.nextOutcome === 'shape_conflict_forced' ? { code: 'shape_conflict', message: 'Forced from the debug panel.' } : null) || checkConflicts(state.artifacts, path);
    if (bad) return resolve({ error: bad });
    if (parsePath(path).kind !== upload.kind) return resolve({ error: { code: 'path_invalid', message: upload.kind === 'bundle' ? 'A folder publishes as a Bundle: end the path with /.' : 'A single file publishes as <name>.html.' } });
    let p = 0;
    const t = setInterval(() => {
      p += 17 + Math.random() * 20;
      onProgress(Math.min(p, 100));
      if (p < 100) return;
      clearInterval(t);
      if (state.nextOutcome === 'busy') return resolve({ error: { code: 'busy', message: 'Another publish of this Artifact is running. Retry in a few seconds.', retryable: true } });
      if (state.nextOutcome === 'storage_unavailable') return resolve({ error: { code: 'storage_unavailable', message: 'S3 is unreachable. Retry later.', retryable: true } });
      const existed = state.artifacts.some((x) => x.path === path);
      const now = new Date().toISOString();
      dispatch({ type: 'upsert', art: { path, title: upload.title || parsePath(path).name, description: description === undefined ? undefined : description, updated: now, publisher: ME, size: upload.size, files: upload.count, state: 'published' } });
      resolve({ status: existed ? 200 : 201, body: { url: urlOf(path) } });
    }, 220);
  });
}

function EditableText({ value, placeholder, onSave, multiline = true, className = '' }) {

      <span className="ml-2 text-xs text-stone-400 opacity-0 group-hover:opacity-100">edit</span></button>`;

      ? html`<textarea autoFocus maxLength=${1000} value=${draft} onChange=${(e) => setDraft(e.target.value)} rows=${3} className="w-full rounded border border-stone-300 bg-white p-2 text-sm"></textarea>`

const shortDate = (iso) => { const t = new Date(iso); const same = t.getFullYear() === new Date().getFullYear(); return t.toLocaleDateString(undefined, same ? { day: 'numeric', month: 'short' } : { day: 'numeric', month: 'short', year: 'numeric' }); };

function filterGroups(state, q, onlyIncomplete) {
  const ql = q.trim().toLowerCase();
  return allProjects(state).map((p) => {
    const desc = state.projects[p] || '';
    const projHit = !ql || (p + ' ' + desc).toLowerCase().includes(ql);
    let arts = state.artifacts.filter((a) => parsePath(a.path).project === p);
    const total = arts.length;
    if (onlyIncomplete) arts = arts.filter((a) => a.state === 'publishing');
    if (ql && !projHit) arts = arts.filter((a) => (a.path + ' ' + a.title + ' ' + a.description + ' ' + a.publisher).toLowerCase().includes(ql));
    arts.sort((a, b) => b.updated.localeCompare(a.updated));
    const latest = state.artifacts.filter((a) => parsePath(a.path).project === p).reduce((m, a) => (a.updated > m ? a.updated : m), '');
    return { project: p, desc, arts, total, latest, visible: onlyIncomplete ? arts.length > 0 : projHit || arts.length > 0 };
  }).filter((g) => g.visible)
    .sort((a, b) => (!a.total - !b.total) || b.latest.localeCompare(a.latest)); // most recently active first, empty Projects last
}

// Publish form used by all three variants (they differ in WHERE it opens, not in its fields).
function PublishPanel({ state, dispatch, setToast, prefix = '', fixedPath, entries, onDone, onCancel }) {
  const [upload, setUpload] = useState(null);
  const [path, setPath] = useState(fixedPath || '');
  const [desc, setDesc] = useState('');
  const [noOverwrite, setNoOverwrite] = useState(false);
  const [progress, setProgress] = useState(null);
  const [result, setResult] = useState(null);
  const [over, setOver] = useState(false);
  const fileIn = useRef(), dirIn = useRef();
  async function take(list) {
    const u = await describeUpload(list); setUpload(u); setResult(null);
    if (u && !u.error && !fixedPath) setPath(prefix + u.suggested + (u.kind === 'bundle' ? '/' : '.html'));
  }
  useEffect(() => { if (entries) take(entries); }, []);
  const pathErr = upload && !upload.error && path && (validatePath(path) || checkConflicts(state.artifacts, path));
  const exists = state.artifacts.some((a) => a.path === path);
  async function go() {
    if (noOverwrite && exists) return setResult({ error: { code: 'exists', message: 'An Artifact already exists at this path (412).' } });
    setProgress(0); setResult(null);
    const r = await simulatePublish(state, dispatch, { path, upload, description: desc || undefined }, setProgress);
    setProgress(null); setResult(r);
    if (!r.error) { setToast((r.status === 201 ? 'Published ' : 'Replaced ') + r.body.url); onDone?.(path); }
  }
  const pickers = html`<button className="underline decoration-stone-300 underline-offset-2 hover:text-brand-700" onClick=${() => fileIn.current.click()}>choose a file</button> or <button className="underline decoration-stone-300 underline-offset-2 hover:text-brand-700" onClick=${() => dirIn.current.click()}>a folder</button>
    <input ref=${fileIn} type="file" accept=".html,.htm" className="hidden" onChange=${(e) => take(filesFromList(e.target.files))} />
    <input ref=${dirIn} type="file" webkitdirectory="" className="hidden" onChange=${(e) => take(filesFromList(e.target.files))} />`;
  return html`<div className="text-sm">
    ${!upload || upload.error ? html`<div onDragOver=${(e) => { e.preventDefault(); e.stopPropagation(); setOver(true); }} onDragLeave=${() => setOver(false)}
        onDrop=${async (e) => { e.preventDefault(); e.stopPropagation(); setOver(false); take(await filesFromDataTransfer(e.dataTransfer)); }}
        className=${'rounded-lg border-2 border-dashed px-4 py-6 text-center ' + (over ? 'border-brand-600 bg-brand-50' : 'border-line bg-white text-stone-500')}>
      Drop an <b className="text-stone-700">.html</b> file or a <b className="text-stone-700">folder</b>${fixedPath ? html` to replace <span className="font-mono">/${fixedPath}</span>` : prefix ? html` into <span className="font-mono">/${prefix}</span>` : ''} — or ${pickers}
      ${upload?.error && html`<div className="mt-2 text-red-700"><code>${upload.error.code}</code> — ${upload.error.message}</div>`}</div>`
    : html`<div className="rounded-lg border border-line bg-white p-4">
      <div className="flex items-center gap-2 text-stone-600">${upload.kind === 'bundle' ? Icon.bundle : Icon.file}
        ${upload.kind === 'bundle' ? 'Bundle' : 'Single file'} · ${plural(upload.count, 'file')} · ${fmtSize(upload.size)}${upload.title ? html` · <span className="text-stone-900">“${upload.title}”</span>` : ' · no <title>'}
        <button onClick=${() => setUpload(null)} className="ml-auto text-xs text-stone-400 hover:text-stone-700">change</button></div>
      ${upload.skipped.length > 0 && html`<div className="mt-1 text-xs text-amber-800">Skipping ${plural(upload.skipped.length, 'dot-file')}: ${upload.skipped.slice(0, 4).join(', ')}${upload.skipped.length > 4 ? '…' : ''}</div>`}
      <label className="mt-3 block text-xs font-medium text-stone-500">Path</label>
      <div className="flex items-center rounded-md border border-line font-mono focus-within:border-brand-600"><span className="pl-2.5 text-stone-400">pub.bdgn.me/</span>
        <input value=${path} disabled=${!!fixedPath} onChange=${(e) => setPath(e.target.value)} className="flex-1 bg-transparent px-1 py-2 outline-none disabled:text-stone-500" /></div>
      <div className=${'mt-1 text-xs ' + (pathErr ? 'text-red-700' : 'text-stone-500')}>${pathErr ? html`<code>${pathErr.code}</code> — ${pathErr.message}` : exists ? 'Replaces the existing Artifact in place (same URL).' : 'New Artifact.'}</div>
      <label className="mt-3 block text-xs font-medium text-stone-500">Description <span className="font-normal text-stone-400">— optional, private${exists ? '; leave empty to keep the current one' : ''}</span></label>
      <textarea value=${desc} maxLength=${1000} onChange=${(e) => setDesc(e.target.value)} rows=${2} className="w-full rounded-md border border-line p-2 outline-none focus:border-brand-600"></textarea>
      ${!fixedPath && html`<label className="mt-2 flex items-center gap-2 text-stone-600"><input type="checkbox" checked=${noOverwrite} onChange=${(e) => setNoOverwrite(e.target.checked)} /> Don't overwrite an existing Artifact</label>`}
      ${progress !== null && html`<div className="mt-3 h-1.5 overflow-hidden rounded bg-stone-200"><div className="h-full bg-brand-600 transition-all" style=${{ width: progress + '%' }}></div></div>`}
      ${result?.error && html`<div className="mt-3 rounded-md bg-red-50 p-2 text-red-800"><code>${result.error.code}</code> — ${result.error.message}${result.error.retryable ? ' (retryable)' : ''}</div>`}
      <div className="mt-3 flex items-center gap-2">
        <button disabled=${!!pathErr || !path || progress !== null} onClick=${go} className="rounded-md bg-brand-700 px-3.5 py-1.5 font-medium text-white disabled:opacity-40">${result?.error?.retryable ? 'Retry' : exists ? 'Replace' : 'Publish'}</button>
        ${onCancel && html`<button onClick=${onCancel} className="px-2 py-1.5 text-stone-500 hover:text-stone-800">Cancel</button>`}</div>
    </div>`}
    ${(!upload || upload.error) && onCancel && html`<div className="mt-2 text-right"><button onClick=${onCancel} className="text-stone-500 hover:text-stone-800">Cancel</button></div>`}
  </div>`;
}

    <main className=${'mx-auto px-8 pb-28 pt-10 ' + (wide ? 'max-w-none' : 'max-w-6xl')}>${children}</main></div>`;

        <${Hero} state=${state} onPublish=${() => setDialog({ prefix: '' })} />
        <${Attention} state=${state} onShow=${() => setOnly(true)} />
        <${Toolbar} q=${q} setQ=${setQ} only=${only} setOnly=${setOnly} state=${state} groups=${groups} />
        <div className="mt-4 overflow-hidden rounded-xl border border-line bg-white">
          ${groups.map((g) => html`<section key=${g.project} onDragEnter=${() => setHoverProject(g.project)}
              className=${dragging && hoverProject === g.project ? 'relative ring-2 ring-inset ring-brand-600' : ''}>
            <div className="flex items-start gap-3 border-t border-line bg-brand-50/50 px-6 py-3 first:border-t-0">
              <span className="mt-0.5 text-stone-500">${Icon.folder}</span>
              <div className="min-w-0 flex-1">
                <div className="flex items-baseline gap-2"><span className="font-semibold text-stone-900">${g.project}</span><span className="font-mono text-xs text-stone-500">/${g.project}/</span>
                  <span className="ml-auto text-xs text-stone-500">${dragging && hoverProject === g.project ? html`<b className="text-brand-700">Drop to publish into /${g.project}/</b>` : plural(g.total, 'Artifact')}</span></div>
                <${ProjectDesc} project=${g.project} state=${state} dispatch=${dispatch} className="text-sm text-stone-600" /></div>
            </div>
            ${g.arts.length ? g.arts.map((a) => html`<div key=${a.path} onClick=${() => setSel(sel === a.path ? null : a.path)}
                className=${'grid cursor-pointer grid-cols-[minmax(0,1fr)_7rem_5.5rem_2rem] gap-5 border-t border-line px-6 py-4 ' + (sel === a.path ? 'bg-brand-50 shadow-[inset_3px_0_0] shadow-brand-600' : 'hover:bg-canvas/60')}>
              <div className="min-w-0">
                <div className="flex items-center gap-2"><span className="font-semibold text-stone-900">${a.title}</span>${a.state === 'publishing' && html`<${Incomplete} />`}</div>
                <div className="mt-0.5 font-mono text-xs text-stone-500">/${a.path}</div>
                <p className="mt-2 text-[15px] leading-relaxed text-stone-600">${a.description || html`<i className="text-stone-400">No private description</i>`}</p></div>
              <div className="text-sm text-stone-600">${shortDate(a.updated)}<div className="text-xs text-stone-400">by ${a.publisher}</div></div>
              <div className="text-right font-mono text-xs text-stone-600">${fmtSize(a.size)}<div className="text-stone-400">${plural(a.files, 'file')}</div></div>
              <div className="flex items-start justify-end"><${IconBtn} title="Open" href=${urlOf(a.path)}>${Icon.open}<//></div>
            </div>`) : html`<div className="border-t border-line px-6 py-5 pl-14 text-sm text-stone-500">No Artifacts yet — drop a file or folder here to publish.</div>`}
          </section>`)}
        </div>
        <p className="mt-3 text-xs text-stone-500">Click a row for preview and actions. Drop a file or folder anywhere to publish; dropping over a Project pre-fills its path.</p>
      </main>
    </div>
    ${art && html`<aside className="sticky top-0 flex h-screen w-[40rem] shrink-0 flex-col border-l border-line bg-white">
      <div className="flex items-start gap-3 border-b border-line p-5">
        <div className="min-w-0 flex-1">
          <div className="flex items-center gap-2"><h2 className="truncate text-lg font-semibold tracking-tight">${art.title}</h2>${art.state === 'publishing' && html`<${Incomplete} />`}</div>
          <a href=${urlOf(art.path)} target="_blank" className="font-mono text-xs text-brand-700 underline underline-offset-4">${urlOf(art.path)}</a></div>
        <${IconBtn} title="Copy link" onClick=${() => copy(urlOf(art.path), setToast)}>${Icon.copy}<//>
        <${IconBtn} title="Open" href=${urlOf(art.path)}>${Icon.open}<//>
        <button onClick=${() => setSel(null)} className="p-1.5 text-stone-400 hover:text-stone-800">${Icon.x}</button></div>
      <${PreviewFrame} art=${art} className="min-h-0 w-full flex-1 border-b border-line" />
      <div className="max-h-[45%] overflow-y-auto p-5 text-sm">
        <div className="text-xs font-medium text-stone-500">Description</div>
        <${Desc} art=${art} dispatch=${dispatch} className="mt-1 text-[15px] leading-relaxed text-stone-700" />
        <dl className="mt-4 grid grid-cols-[6rem_1fr] gap-y-1 text-xs text-stone-600">
          <dt className="text-stone-400">Updated</dt><dd>${fullDate(art.updated)} by ${art.publisher}</dd>
          <dt className="text-stone-400">Created</dt><dd>${fullDate(art.created)}</dd>
          <dt className="text-stone-400">Content</dt><dd>${parsePath(art.path).kind === 'bundle' ? 'Bundle' : 'Single file'} · ${plural(art.files, 'file')} · ${fmtSize(art.size)}</dd></dl>
        <div className="mt-4 flex gap-2">
          <button onClick=${() => setDialog({ fixedPath: art.path })} className="rounded-md border border-line px-2.5 py-1 hover:border-brand-600">Publish new version</button>
          <button onClick=${() => setDel(true)} className="rounded-md px-2.5 py-1 text-red-700 hover:bg-red-50">Delete</button></div>
        ${del && html`<${DeleteConfirm} art=${art} dispatch=${dispatch} setToast=${(t) => { setToast(t); setSel(null); }} onCancel=${() => setDel(false)} />`}
      </div></aside>`}
    ${dragging && html`<div className="pointer-events-none fixed inset-x-0 bottom-20 z-30 flex justify-center"><div className="rounded-full bg-brand-900 px-4 py-2 text-sm text-white shadow-lg">
      ${hoverProject ? `Drop to publish into /${hoverProject}/` : 'Drop to publish — you will choose the path'}</div></div>`}
    ${dialog && html`<div className="fixed inset-0 z-40 flex items-start justify-center bg-stone-900/30 pt-24" onClick=${() => setDialog(null)}>
      <div className="w-[36rem] rounded-xl bg-canvas p-5 shadow-2xl" onClick=${(e) => e.stopPropagation()}>
        <div className="mb-3 flex items-center"><h2 className="text-lg font-semibold tracking-tight">${dialog.fixedPath ? 'Publish new version' : 'Publish'}</h2>
          <button onClick=${() => setDialog(null)} className="ml-auto text-stone-400 hover:text-stone-800">${Icon.x}</button></div>
        <${PublishPanel} state=${state} dispatch=${dispatch} setToast=${setToast} prefix=${dialog.prefix || ''} fixedPath=${dialog.fixedPath} entries=${dialog.entries}
          onDone=${(p) => { setDialog(null); setSel(p); }} />
      </div></div>`}
  </div>`;
}

const VARIANTS = [
  { key: 'A', name: 'Inventory', C: V2A },
  { key: 'B', name: 'Categories + expand', C: V2B },
  { key: 'C', name: 'Preview drawer', C: V2C },
];

// ───────────────────────── floating variant switcher (prototype chrome) ─────────────────────────

function Switcher({ current, setCurrent, state, dispatch }) {
  const [showState, setShowState] = useState(false);
  const i = VARIANTS.findIndex((v) => v.key === current);
  const go = useCallback((delta) => setCurrent(VARIANTS[(i + delta + VARIANTS.length) % VARIANTS.length].key), [i]);
  useEffect(() => {
    const k = (e) => {
      if (e.target.closest('input,textarea,[contenteditable]')) return;
      if (e.key === 'ArrowLeft') go(-1);
      if (e.key === 'ArrowRight') go(1);
    };
    window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k);
  }, [go]);
  return html`<div>
    ${showState && html`<div className="fixed bottom-16 left-1/2 z-[60] max-h-[60vh] w-[40rem] -translate-x-1/2 overflow-auto rounded-xl bg-black/90 p-3 font-mono text-[11px] text-lime-300 shadow-2xl">
      <div className="mb-2 flex items-center gap-2 font-sans text-xs text-stone-300">Next publish outcome:
        <select value=${state.nextOutcome} onChange=${(e) => dispatch({ type: 'outcome', value: e.target.value })} className="rounded bg-stone-800 px-1 py-0.5">
          ${['ok', 'busy', 'storage_unavailable', 'shape_conflict_forced'].map((o) => html`<option key=${o}>${o}</option>`)}</select></div>
      <pre>${JSON.stringify(state, null, 1)}</pre></div>`}
    <div className="fixed bottom-4 left-1/2 z-[60] flex -translate-x-1/2 items-center gap-1 rounded-full bg-fuchsia-600 px-2 py-1 text-sm font-medium text-white shadow-xl ring-2 ring-white">
      <button onClick=${() => go(-1)} className="rounded-full px-2 hover:bg-white/20">←</button>
      <span className="px-2">PROTOTYPE · ${current} (${VARIANTS[i].name})</span>
      <button onClick=${() => go(1)} className="rounded-full px-2 hover:bg-white/20">→</button>
      <button onClick=${() => setShowState(!showState)} className="ml-1 rounded-full px-2 font-mono hover:bg-white/20" title="state + debug">{ }</button>
    </div></div>`;
}
function App() {
  const [state, dispatch] = useReducer(reducer, initialState);
  const [current, setCur] = useState(() => new URLSearchParams(location.search).get('variant')?.toUpperCase() || 'A');
  const setCurrent = (v) => { const u = new URL(location.href); u.searchParams.set('variant', v); history.replaceState(null, '', u); setCur(v); };
  const V = (VARIANTS.find((v) => v.key === current) || VARIANTS[0]).C;
  return html`<${React.Fragment}><${V} key=${current} state=${state} dispatch=${dispatch} /><${Switcher} current=${current} setCurrent=${setCurrent} state=${state} dispatch=${dispatch} /><//>`;
}
createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
