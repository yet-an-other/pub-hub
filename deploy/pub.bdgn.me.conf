# Include in nginx's http context (alongside hub.bdgn.me.conf).
# RGW's anonymous GetObject policy must be limited to pubhub-artifacts/*.
# Keep this server on the LAN; a separate loopback listener is added at tunnel go-live.
map $http_if_none_match $pubhub_etag {
    ~^W/(.*)$ $1;
    default $http_if_none_match;
}
map $uri $pubhub_slash {
    ~^/[^/]+(?:/[^/.]+)+$ $uri/;
    default "";
}
map $uri $pubhub_key {
    ~/$ ${uri}index.html;
    default $uri;
}
limit_req_zone $binary_remote_addr zone=pubhub_readers:10m rate=20r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pub.bdgn.me;

    # ssl_certificate     /path/to/bdgn.me/fullchain.pem;
    # ssl_certificate_key /path/to/bdgn.me/privkey.pem;

    absolute_redirect off;
    if ($http_service_worker = "script") { return 403; }
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    limit_req zone=pubhub_readers burst=40 nodelay;
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/xml image/svg+xml text/plain;

    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Only the three validator/range headers cross into RGW. Stock nginx cannot
    # hide response headers by wildcard; enumerate the RGW S3 headers here.
    proxy_pass_request_headers off;
    proxy_set_header Host 127.0.0.1:7480;
    proxy_set_header Connection "";
    proxy_set_header Range $http_range;
    proxy_set_header If-None-Match $pubhub_etag;
    proxy_set_header If-Modified-Since $http_if_modified_since;
    proxy_hide_header Cache-Control;
    proxy_hide_header Service-Worker-Allowed;
    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-amz-id-2;
    proxy_hide_header x-amz-bucket-region;
    proxy_hide_header x-amz-version-id;
    proxy_hide_header x-amz-server-side-encryption;
    proxy_hide_header x-amz-meta;
    proxy_hide_header x-rgw-object-type;
    proxy_hide_header x-rgw-id;
    proxy_intercept_errors on;
    proxy_cache off;

    # Prefixes have no entry. The reserved 'index' stem makes these safe.
    location = / { return 404; }
    location = /robots.txt { return 404; }

    location / {
        error_page 403 404 = @pubhub_missing;
        # Variables prevent nginx from forwarding Reader query strings to S3.
        # $uri is normalized, so S3 keys follow the same path nginx serves.
        proxy_pass http://127.0.0.1:7480/pubhub-artifacts$pubhub_key;
    }

    location @pubhub_missing {
        if ($pubhub_slash != "") { return 301 $pubhub_slash$is_args$args; }
        return 404;
    }
}
