# nginx server block for hub.bdgn.me: the Portal.
# Internal DNS only; no public record. TLS certificates come from the owner's
# existing *.bdgn.me process and stay outside pub-hub.

upstream pubhub_portal {
    server unix:/run/pubhub/portal.sock;
}

upstream pubhub_oauth2 {
    server unix:/run/oauth2-proxy/o2p.sock;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hub.bdgn.me;

    # ssl_certificate     /path/to/bdgn.me/fullchain.pem;
    # ssl_certificate_key /path/to/bdgn.me/privkey.pem;

    # LAN and VPN only. Adjust to the host's ranges.
    allow 192.168.0.0/16;   # LAN
    allow 10.0.0.0/8;       # VPN
    deny  all;

    # Every hub. response, errors included. A location that adds its own
    # add_header must repeat these, since nginx does not inherit them then.
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Content-Security-Policy      "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options       "nosniff" always;
    add_header X-Robots-Tag                 "noindex, nofollow" always;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;

    # Machine Publishers use bearer auth in the Portal. There is deliberately
    # no auth_request here; cookies and identity headers are ignored by /api/.
    location ^~ /api/ {
        client_max_body_size 101m;
        proxy_connect_timeout 30s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_pass http://pubhub_portal;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Auth-Request-User  "";
        proxy_set_header X-Auth-Request-Email "";
    }

    location = /healthz {
        proxy_pass http://pubhub_portal;
        proxy_set_header Host $host;
        # The Portal will trust these; never let a client set them.
        proxy_set_header X-Auth-Request-User  "";
        proxy_set_header X-Auth-Request-Email "";
    }

    location = /readyz {
        proxy_pass http://pubhub_portal;
        proxy_set_header Host $host;
        proxy_set_header X-Auth-Request-User  "";
        proxy_set_header X-Auth-Request-Email "";
    }

    # Only nginx can call this endpoint. The URI is forced, not taken from a
    # client header; oauth2-proxy must not be allowed to authenticate a
    # different request from the one nginx is checking.
    location = /oauth2/auth {
        internal;
        proxy_pass http://pubhub_oauth2;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Auth-Request-User "";
        proxy_set_header X-Auth-Request-Email "";
    }

    location ^~ /oauth2/ {
        proxy_pass http://pubhub_oauth2;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Auth-Request-User "";
        proxy_set_header X-Auth-Request-Email "";
    }

    location ^~ /ui/api/ {
        client_max_body_size 101m;
        proxy_connect_timeout 30s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        auth_request /oauth2/auth;
        auth_request_set $pubhub_user $upstream_http_x_auth_request_user;
        auth_request_set $pubhub_email $upstream_http_x_auth_request_email;
        error_page 401 = @ui_unauthorized;
        proxy_pass http://pubhub_portal;
        proxy_set_header Host $host;
        proxy_set_header X-Auth-Request-User $pubhub_user;
        proxy_set_header X-Auth-Request-Email $pubhub_email;
    }

    location @ui_unauthorized {
        default_type application/json;
        return 401 '{"error":{"code":"unauthenticated","message":"browser session required"}}';
    }

    location = /robots.txt {
        return 404;
    }

    location @hub_signin {
        return 302 /oauth2/sign_in?rd=$request_uri;
    }

    location / {
        auth_request /oauth2/auth;
        auth_request_set $pubhub_user $upstream_http_x_auth_request_user;
        auth_request_set $pubhub_email $upstream_http_x_auth_request_email;
        error_page 401 = @hub_signin;
        proxy_pass http://pubhub_portal;
        proxy_set_header Host $host;
        proxy_set_header X-Auth-Request-User $pubhub_user;
        proxy_set_header X-Auth-Request-Email $pubhub_email;
    }
}
