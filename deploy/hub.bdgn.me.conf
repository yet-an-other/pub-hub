# nginx server block for hub.bdgn.me: the Portal.
# Internal DNS only; no public record. TLS certificates come from the owner's
# existing *.bdgn.me process and stay outside pub-hub.

upstream pubhub_portal {
    server unix:/run/pubhub/portal.sock;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hub.bdgn.me;

    # ssl_certificate     /path/to/bdgn.me/fullchain.pem;
    # ssl_certificate_key /path/to/bdgn.me/privkey.pem;

    # LAN and VPN only. Adjust to the host's ranges.
    allow 192.168.0.0/16;   # LAN
    allow 10.0.0.0/8;       # VPN
    deny  all;

    # Every hub. response, errors included. A location that adds its own
    # add_header must repeat these, since nginx does not inherit them then.
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Content-Security-Policy      "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options       "nosniff" always;
    add_header X-Robots-Tag                 "noindex, nofollow" always;

    # Machine Publishers use bearer auth in the Portal. There is deliberately
    # no auth_request here; cookies and identity headers are ignored by /api/.
    location ^~ /api/ {
        client_max_body_size 101m;
        proxy_pass http://pubhub_portal;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Auth-Request-User  "";
        proxy_set_header X-Auth-Request-Email "";
    }

    location = /healthz {
        proxy_pass http://pubhub_portal;
        proxy_set_header Host $host;
        # The Portal will trust these; never let a client set them.
        proxy_set_header X-Auth-Request-User  "";
        proxy_set_header X-Auth-Request-Email "";
    }

    location = /readyz {
        proxy_pass http://pubhub_portal;
        proxy_set_header Host $host;
        proxy_set_header X-Auth-Request-User  "";
        proxy_set_header X-Auth-Request-Email "";
    }

    # Nothing else is served yet.
    location / {
        return 404;
    }
}
