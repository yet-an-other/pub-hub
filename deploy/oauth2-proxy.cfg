# oauth2-proxy v7.15.2+; secrets are supplied by systemd credentials.
http_address = "unix:///run/oauth2-proxy/o2p.sock,mode=0660"
provider = "oidc"
oidc_issuer_url = "https://zitadel.example.invalid"
client_id = "replace-with-hub-browser-client-id"
redirect_url = "https://hub.bdgn.me/oauth2/callback"
code_challenge_method = "S256"
client_secret_file = "/run/credentials/oauth2-proxy.service/hub-browser-client-secret"
cookie_secret_file = "/run/credentials/oauth2-proxy.service/cookie-secret"
cookie_name = "__Host-pubhub"
cookie_secure = true
cookie_samesite = "lax"
cookie_expire = "12h"
cookie_refresh = "0"
session_cookie_minimal = true
authenticated_emails_file = "/etc/oauth2-proxy/owner-emails"
set_xauthrequest = true
reverse_proxy = true
upstreams = ["static://200"]
