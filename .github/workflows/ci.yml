name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PUBHUB_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      PUBHUB_TEST_S3_ACCESS_KEY: pubhubtest
      PUBHUB_TEST_S3_SECRET_KEY: pubhubtest-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Chromium for Catalogue browser tests and nginx for Reader checks
        run: sudo apt-get update && sudo apt-get install -y chromium nginx
      - run: cd web && npm ci && npm test && npm run build
      - run: go vet ./...
      - name: Start local S3-compatible server
        # MinIO RELEASE.2025-04-22T22-12-26Z, rebuilt from source by coollabsio.
        # Docker Hub no longer serves minio/minio; pin the mirror by digest.
        run: |
          docker run --detach --name pubhub-test-s3 --publish 9000:9000 \
            --env MINIO_ROOT_USER=pubhubtest \
            --env MINIO_ROOT_PASSWORD=pubhubtest-secret \
            --env MINIO_SITE_REGION=default \
            ghcr.io/coollabsio/minio@sha256:a4938f37f1be1841b8e7b627ad0207b265345fd0d063e42d7410c78af0e63e68 server /data
      - run: go test -race ./...
      - run: sh scripts/test-install-pubhub.sh
