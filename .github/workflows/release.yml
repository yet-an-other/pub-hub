name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PUBHUB_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      PUBHUB_TEST_S3_ACCESS_KEY: pubhubtest
      PUBHUB_TEST_S3_SECRET_KEY: pubhubtest-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npx playwright install --with-deps chromium && npm test && npm run build
      - run: go vet ./...
      - name: Install nginx for Reader integration checks
        run: sudo apt-get update && sudo apt-get install -y nginx
      - name: Start local S3-compatible server
        run: |
          docker run --detach --name pubhub-test-s3 --publish 9000:9000 \
            --env MINIO_ROOT_USER=pubhubtest \
            --env MINIO_ROOT_PASSWORD=pubhubtest-secret \
            --env MINIO_SITE_REGION=default \
            ghcr.io/coollabsio/minio@sha256:a4938f37f1be1841b8e7b627ad0207b265345fd0d063e42d7410c78af0e63e68 server /data
      - run: go test -race ./...
      - run: sh scripts/test-install-pubhub.sh
      - name: Build
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags="-s -w -X github.com/yet-an-other/pub-hub/internal/buildversion.Release=$GITHUB_REF_NAME" \
              -o "dist/pubhub-portal-linux-$arch" ./cmd/pubhub-portal
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags="-s -w -X github.com/yet-an-other/pub-hub/internal/buildversion.Release=$GITHUB_REF_NAME" \
              -o "dist/pubhub-linux-$arch" ./cmd/pubhub
          done
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w -X github.com/yet-an-other/pub-hub/internal/buildversion.Release=$GITHUB_REF_NAME" \
            -o dist/pubhub-darwin-arm64 ./cmd/pubhub
          cd dist && sha256sum pubhub-* > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
